<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Price Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #0d1117; color: #e6edf3; }
    h1 { text-align: center; margin: 0 0 4px; font-size: 1.4rem; color: #f0f6fc; }
    .subtitle { text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 16px; }
    .stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
    .stat { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 16px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: #8b949e; }
    .stat-value { font-size: 1rem; font-weight: bold; color: #f0f6fc; }
    .stat-value.up { color: #3fb950; }
    .stat-value.down { color: #f85149; }
    .chart-container { position: relative; height: clamp(300px, 45vw, 520px); width: 100%; }
    body.compact { padding: 0; background: transparent; }
    body.compact h1, body.compact .subtitle, body.compact .stats { display: none; }
    body.compact .chart-container { height: clamp(240px, 45vw, 480px); }
  </style>
</head>
<body>
  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('view') === 'compact') document.body.classList.add('compact');
  </script>
  <h1>BTC Price Chart</h1>
  <div class="subtitle">2026-05-06 — 2026-06-04 (30 days)</div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Start</div><div class="stat-value">$81,390.1</div></div>
    <div class="stat"><div class="stat-label">End</div><div class="stat-value">$63,226.1</div></div>
    <div class="stat"><div class="stat-label">High</div><div class="stat-value up">$82,177.7</div></div>
    <div class="stat"><div class="stat-label">Low</div><div class="stat-value down">$63,226.1</div></div>
    <div class="stat"><div class="stat-label">Change</div><div class="stat-value down">-22.32%</div></div>
  </div>
  <div class="chart-container"><canvas id="chart"></canvas></div>
  <script>
    const dates = ["2026-05-06","2026-05-07","2026-05-08","2026-05-09","2026-05-10","2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15","2026-05-16","2026-05-17","2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22","2026-05-23","2026-05-24","2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29","2026-05-30","2026-05-31","2026-06-01","2026-06-02","2026-06-03","2026-06-04"];
    const prices = [81390.1,79969.4,80155.2,80634,82177.7,81699.1,80461,79288.3,81048.9,79074,78104.2,77430.4,76963.2,76799.9,77510.3,77586.2,75513.1,76715.2,77030.3,77281.5,75905.5,74418.1,73591.4,73428.2,73856.8,73653.2,71391.5,66730,64117.7,63226.1];
    const volumes = [12927.851824281799,10847.2263447444,8526.0821058798,4496.718982578201,7707.0861244515,9913.2161833538,9786.2815932395,11165.3289271743,14164.6552041381,12274.1511021978,6741.182933351401,6711.8241881738,13697.2793684195,7602.689911048101,8300.9533069723,9078.5555632321,8902.299341466998,11615.6943676343,6993.11065285,5932.5273061065,12648.0665009323,10883.6011584195,13154.0500903079,10737.399943946199,3867.976708728,4297.697765956001,15369.2382438641,23638.1268209833,20530.4551578275,23861.4939624038];
    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
      data: {
        labels: dates,
        datasets: [
          {
            type: 'line',
            label: 'BTC Price (USD)',
            data: prices,
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88,166,255,0.08)',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.1,
            yAxisID: 'yPrice',
          },
          {
            type: 'bar',
            label: 'Volume (M USD)',
            data: volumes,
            backgroundColor: 'rgba(139,148,158,0.3)',
            borderWidth: 0,
            yAxisID: 'yVol',
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#8b949e', font: { size: 12 } } },
          tooltip: { backgroundColor: '#161b22', titleColor: '#f0f6fc', bodyColor: '#e6edf3', borderColor: '#30363d', borderWidth: 1 }
        },
        scales: {
          x: {
            ticks: { color: '#8b949e', maxRotation: 45, minRotation: 0, maxTicksLimit: 10 },
            grid: { color: '#21262d' }
          },
          yPrice: {
            type: 'linear', position: 'left',
            ticks: { color: '#8b949e', callback: v => '$' + Number(v).toLocaleString() },
            grid: { color: '#21262d' },
            title: { display: true, text: 'Price (USD)', color: '#8b949e' }
          },
          yVol: {
            type: 'linear', position: 'right',
            ticks: { color: '#8b949e' },
            grid: { drawOnChartArea: false },
            title: { display: true, text: 'Volume (M USD)', color: '#8b949e' }
          }
        }
      }
    });
    function sendHeight() {
      const h = document.body.classList.contains('compact')
        ? document.body.scrollHeight
        : Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      window.parent?.postMessage({ type: 'chartHeight', height: h }, '*');
    }
    window.addEventListener('load', () => { setTimeout(sendHeight, 400); setTimeout(sendHeight, 1000); });
    window.addEventListener('resize', () => setTimeout(sendHeight, 300));
  </script>
</body>
</html>
